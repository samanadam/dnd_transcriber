name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    # Windows is where the transcribing actually happens, and it differs in ways
    # that matter: no system time zone database, and a different path layout.
    # Linux-only CI missed both.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install ffmpeg (Linux)
        # Chunking runs entirely through ffmpeg; without it those tests skip
        # rather than fail, which would hide real breakage.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: black --check .

      - name: Test
        run: pytest -q

      - name: Confirm the chunking tests actually ran
        # They skip silently without ffmpeg. Fail if any did, rather than
        # trusting a green run that tested nothing.
        run: |
          output=$(pytest -q tests/test_chunking.py --no-header)
          echo "$output"
          if echo "$output" | grep -q "skipped"; then
            echo "::error::Chunking tests skipped - ffmpeg is missing."
            exit 1
          fi

      - name: Check the CLI is wired up
        run: |
          pip install -e .
          dndt --help
