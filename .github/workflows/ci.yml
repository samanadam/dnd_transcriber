name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    # Windows is where the transcribing actually happens, and it differs in ways
    # that matter: no system time zone database, and a different path layout.
    # Linux-only CI missed both.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install ffmpeg (Linux)
        # Chunking runs entirely through ffmpeg; without it those tests skip
        # rather than fail, which would hide real breakage.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: black --check .

      - name: Test
        run: pytest -q

      - name: Confirm the chunking tests actually ran
        # They skip silently without ffmpeg. Fail if any did, rather than
        # trusting a green run that tested nothing.
        run: |
          output=$(pytest -q tests/test_chunking.py --no-header)
          echo "$output"
          if echo "$output" | grep -q "skipped"; then
            echo "::error::Chunking tests skipped - ffmpeg is missing."
            exit 1
          fi

      - name: Check the CLI is wired up
        run: |
          pip install -e .
          dndt --help

  docker:
    # The image is the production artifact, so a Dockerfile that no longer
    # builds is a broken release, not a stale extra file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: dnd-transcriber:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          load: true
          tags: dnd-transcriber:ci-dev
          cache-from: type=gha

      - name: The suite passes inside the real image
        # Catches anything that differs between a developer machine and the
        # image itself - a missing system package, a missing time zone
        # database - which host-only testing cannot see.
        run: docker run --rm dnd-transcriber:ci-dev pytest -q

      - name: Chunking tests ran rather than skipped
        run: |
          output=$(docker run --rm dnd-transcriber:ci-dev pytest -q tests/test_chunking.py --no-header)
          echo "$output"
          if echo "$output" | grep -q "skipped"; then
            echo "::error::Chunking tests skipped - ffmpeg missing from the image."
            exit 1
          fi

      - name: The CLI runs in the production image
        run: docker run --rm dnd-transcriber:ci --help

      - name: Time zones resolve in the production image
        run: |
          docker run --rm --entrypoint python dnd-transcriber:ci             -c "from zoneinfo import ZoneInfo; ZoneInfo('Europe/Istanbul')"

      - name: The production image carries no test tooling
        run: |
          if docker run --rm --entrypoint sh dnd-transcriber:ci -c "command -v pytest"; then
            echo "::error::pytest leaked into the production image."
            exit 1
          fi
