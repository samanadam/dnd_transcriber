name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install ffmpeg
        # Chunking runs entirely through ffmpeg; without it those tests skip
        # rather than fail, which would hide real breakage.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: black --check .

      - name: Test
        run: pytest -q

      - name: Confirm the chunking tests actually ran
        # They skip silently without ffmpeg, so assert they did not.
        run: pytest -q tests/test_chunking.py --no-header | tee /dev/stderr | grep -qv "skipped"

      - name: Check the CLI is wired up
        run: |
          pip install -e .
          dndt --help
