name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    # Windows is where the transcribing actually happens, and it differs in ways
    # that matter: no system time zone database, and a different path layout.
    # Linux-only CI missed both.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install ffmpeg (Linux)
        # Chunking runs entirely through ffmpeg; without it those tests skip
        # rather than fail, which would hide real breakage.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: black --check .

      - name: Test
        run: pytest -q

      - name: Confirm the chunking tests actually ran
        # They skip silently without ffmpeg. Fail if any did, rather than
        # trusting a green run that tested nothing.
        run: |
          output=$(pytest -q tests/test_chunking.py --no-header)
          echo "$output"
          if echo "$output" | grep -q "skipped"; then
            echo "::error::Chunking tests skipped - ffmpeg is missing."
            exit 1
          fi

      - name: Check the CLI is wired up
        run: |
          pip install -e .
          dndt --help

  docker:
    # The images are the production artifacts, so a Dockerfile that no longer
    # builds is a broken release, not a stale extra file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space for the CUDA layers
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - uses: docker/setup-buildx-action@v3

      - name: Build the GPU image (default target)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: dnd-transcriber:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: cpu
          load: true
          tags: dnd-transcriber:ci-cpu
          cache-from: type=gha

      - name: Build the dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          load: true
          tags: dnd-transcriber:ci-dev
          cache-from: type=gha

      - name: The suite passes inside the real image
        # Catches anything that differs between a developer machine and the
        # image itself - a missing system package, a missing time zone
        # database - which host-only testing cannot see.
        run: docker run --rm dnd-transcriber:ci-dev pytest -q

      - name: Chunking tests ran rather than skipped
        run: |
          output=$(docker run --rm dnd-transcriber:ci-dev pytest -q tests/test_chunking.py --no-header)
          echo "$output"
          if echo "$output" | grep -q "skipped"; then
            echo "::error::Chunking tests skipped - ffmpeg missing from the image."
            exit 1
          fi

      - name: The GPU image carries loadable CUDA libraries
        run: |
          docker run --rm --entrypoint python dnd-transcriber:ci -c \
            "import ctypes; ctypes.CDLL('libcublas.so.12'); ctypes.CDLL('libcudnn.so.9')"

      - name: With no GPU, the GPU image falls back to the CPU instead of failing
        # CI runners have no GPU, which makes them the right place to prove the
        # default image is never a dead end on a CPU-only machine.
        run: |
          output=$(docker run --rm dnd-transcriber:ci status)
          echo "$output"
          echo "$output" | grep -q "Device:    cpu/int8 (auto, no GPU visible)"

      - name: The CPU image carries no CUDA libraries
        run: |
          if docker run --rm --entrypoint sh dnd-transcriber:ci-cpu \
              -c "ls /usr/local/lib/python3.11/site-packages/nvidia"; then
            echo "::error::CUDA libraries leaked into the CPU image."
            exit 1
          fi

      - name: Both images run the CLI and resolve time zones
        run: |
          for image in dnd-transcriber:ci dnd-transcriber:ci-cpu; do
            docker run --rm "$image" --help
            docker run --rm --entrypoint python "$image" \
              -c "from zoneinfo import ZoneInfo; ZoneInfo('Europe/Istanbul')"
          done

      - name: No shipped image carries test tooling
        run: |
          for image in dnd-transcriber:ci dnd-transcriber:ci-cpu; do
            if docker run --rm --entrypoint sh "$image" -c "command -v pytest"; then
              echo "::error::pytest leaked into $image."
              exit 1
            fi
          done
