[project]
name = "dnd-transcriber"
version = "1.1.0"
description = "Offline Whisper transcription worker for D&D session recordings"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Eren YANGİL", email = "erendukan.34@gmail.com" }]
readme = "README.md"

[project.scripts]
dndt = "dnd_transcriber.cli:main"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
