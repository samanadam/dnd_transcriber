[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dnd-transcriber"
version = "1.2.0"
description = "Offline Whisper transcription worker for D&D session recordings"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eren YANGİL", email = "erendukan.34@gmail.com" }]
readme = "README.md"

# Without this, setuptools autodiscovery walks the repo root and refuses to
# build whenever an untracked top-level directory is present.
[tool.setuptools]
packages = ["dnd_transcriber"]

[project.scripts]
dndt = "dnd_transcriber.cli:main"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
